<!DOCTYPE html>
<html>

<head>
    <title>Calculator iOS</title>
    <!-- <link rel="stylesheet" type="text/css" href="styles.css"> -->

</head>

<body>

    <!-- <p style="">X</p> -->
    <div class="screen">
        <p id="display">0</p>


        <button style="text-align: left; left: 19%; top: 86%; width: 125px; border-radius: 50px;" onclick="bnum(0)"
            id="0" class="number">0</button>

        <button style="left: 7%; top: 75%;" onclick="bnum(1)" id="1" class="number">1</button>
        <button style="left: 31%; top: 75%;" onclick="bnum(2)" id="2" class="number">2</button>
        <button style="left: 55%; top: 75%;" onclick="bnum(3)" id="3" class="number">3</button>
        <button style="left: 7%; top: 64%;" onclick="bnum(4)" id="4" class="number">4</button>
        <button style="left: 31%; top: 64%;" onclick="bnum(5)" id="5" class="number">5</button>
        <button style="left: 55%; top: 64%;" onclick="bnum(6)" id="6" class="number">6</button>
        <button style="left: 7%; top: 53%;" onclick="bnum(7)" id="7" class="number">7</button>
        <button style="left: 31%; top: 53%;" onclick="bnum(8)" id="8" class="number">8</button>
        <button style="left: 55%; top: 53%;" onclick="bnum(9)" id="9" class="number">9</button>
        <button style="left: 55%; top: 86%;" onclick="bdot()" id="dot" class="number">.</button>

        <button style="left: 7%; top: 42%;" onclick="bdel()" id="del" class="acc">AC</button>
        <button style="left: 31%; top: 42%;" onclick="bsign()" id="sign" class="acc">+/-</button>
        <button style="left: 55%; top: 42%;" onclick="bpercent()" id="percent" class="acc">%</button>

        <button style="left: 79%; top: 75%;" onclick="bState(1)" id="add" class="operater">+</button>
        <button style="left: 79%; top: 64%;" onclick="bState(2)" id="sub" class="operater">-</button>
        <button style="left: 79%; top: 53%;" onclick="bState(3)" id="mul" class="operater">×</button>
        <button style="left: 79%; top: 42%;" onclick="bState(4)" id="div" class="operater">÷</button>
        <button style="left: 79%; top: 86%;" onclick="beql()" id="eql" class="operater">=</button>

        <script src="script.js"></script>
    </div>
    <img
        src="https://scontent.futp1-1.fna.fbcdn.net/v/t1.15752-9/368066567_196251040120622_3475313600868369458_n.jpg?stp=dst-jpg_p320x320&_nc_cat=107&ccb=1-7&_nc_sid=510075&_nc_ohc=7PoUeEz5fhsAX8LuQh5&_nc_ht=scontent.futp1-1.fna&oh=03_AdRB8JQ2JqEFn0D_vCkbEiI-GUwpwPkiv4WtFJGHcZTmog&oe=657800ED">
</body>

</html>
